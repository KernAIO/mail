name: CI
on:
  # `release/**` is where the nightly release pushes its dependency reach before landing it on
  # main — the same suite, on a branch, is what decides whether that commit is allowed to land.
  push: { branches: [main, 'release/**'] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read, packages: read }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://kern:kern@127.0.0.1:5432/kern
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_URL: http://127.0.0.1:8025
    services:
      # The suites run against a real Postgres: they create a scratch database per file, apply the
      # migrations and prove row-level security by connecting as an unprivileged role. Nothing here
      # is mocked, so without this service the whole suite fails to start rather than quietly
      # passing.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern
          POSTGRES_DB: kern
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # `mail` sends over SMTP for real and then reads the message back out of the inbox.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      # Mailpit publishes no health check, so wait for its API rather than letting the suite fail on
      # a container that simply had not finished starting.
      - name: Wait for Mailpit
        run: |
          for _ in $(seq 1 30); do
            if curl -sf "$MAILPIT_URL/api/v1/info" >/dev/null; then echo "Mailpit is ready"; exit 0; fi
            sleep 2
          done
          echo "::error::Mailpit never answered on $MAILPIT_URL"
          exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
